<!DOCTYPE html>
<html lang="fr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFlow - Organisation Étudiante</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81' }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        
        /* SPA Navigation Transitions & Flex Height Fix */
        .app-section { display: none; opacity: 0; transition: opacity 0.3s ease; height: 100%; flex-direction: column; }
        .app-section.active { display: flex; animation: fadeIn 0.3s forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); }
        .backface-hidden { backface-visibility: hidden; }
        .card-back { transform: rotateY(180deg); }
        
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1000; }
        .toast { transform: translateY(100%); opacity: 0; transition: all 0.3s ease; }
        .toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>

<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 h-screen overflow-hidden flex transition-colors duration-300">

    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col justify-between z-20 flex-shrink-0">
        <div class="flex-1 overflow-y-auto">
            <div class="h-16 flex items-center px-6 border-b border-slate-200 dark:border-slate-700 sticky top-0 bg-white dark:bg-slate-800 z-10">
                <i class="fa-solid fa-graduation-cap text-brand-600 dark:text-brand-500 text-2xl mr-3"></i>
                <h1 class="text-xl font-bold text-slate-900 dark:text-white tracking-tight">EduFlow</h1>
            </div>
            
            <nav class="p-4 space-y-1" id="nav-menu">
                <button data-target="dashboard" class="nav-btn w-full flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all bg-brand-50 text-brand-600 dark:bg-brand-900/30 dark:text-brand-400">
                    <i class="fa-solid fa-house w-6 text-center mr-2"></i> Vue d'ensemble
                </button>
                <button data-target="tasks" class="nav-btn w-full flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700">
                    <i class="fa-solid fa-kanban w-6 text-center mr-2"></i> Tâches
                </button>
                <button data-target="schedule" class="nav-btn w-full flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700">
                    <i class="fa-regular fa-calendar-days w-6 text-center mr-2"></i> Emploi du temps
                </button>
                <button data-target="notes" class="nav-btn w-full flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700">
                    <i class="fa-solid fa-book w-6 text-center mr-2"></i> Notes & Flashcards
                </button>
                <button data-target="pomodoro" class="nav-btn w-full flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700">
                    <i class="fa-solid fa-stopwatch w-6 text-center mr-2"></i> Pomodoro
                </button>
                <button data-target="grades" class="nav-btn w-full flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700">
                    <i class="fa-solid fa-graduation-cap w-6 text-center mr-2"></i> Moyennes
                </button>
                <button data-target="habits" class="nav-btn w-full flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700">
                    <i class="fa-solid fa-check-double w-6 text-center mr-2"></i> Habitudes
                </button>
                <button data-target="settings" class="nav-btn w-full flex items-center px-4 py-3 text-sm font-medium rounded-xl transition-all text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700">
                    <i class="fa-solid fa-gear w-6 text-center mr-2"></i> Paramètres
                </button>
            </nav>
        </div>

        <div class="p-4 border-t border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800">
            <button id="theme-toggle-btn" class="w-full flex items-center justify-between px-4 py-2 text-sm font-medium rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                <span class="flex items-center"><i class="fa-solid fa-moon w-6 text-center mr-2"></i> Thème sombre</span>
                <div class="w-10 h-5 bg-slate-300 dark:bg-brand-600 rounded-full relative transition-colors duration-300">
                    <div id="theme-toggle-dot" class="w-4 h-4 bg-white rounded-full absolute top-0.5 left-0.5 transform transition-transform duration-300 shadow-sm"></div>
                </div>
            </button>
        </div>
    </aside>

    <!-- Main Content Area with Strict Height Control -->
    <main class="flex-1 overflow-hidden relative flex flex-col h-full">
        <div class="p-8 max-w-7xl mx-auto w-full h-full flex flex-col">
            
            <!-- VIEW: DASHBOARD -->
            <section id="dashboard-view" class="app-section active overflow-y-auto">
                <header class="mb-8 flex-shrink-0">
                    <h2 class="text-3xl font-bold text-slate-900 dark:text-white" id="dash-greeting">Bonjour !</h2>
                    <p class="text-slate-500 dark:text-slate-400 mt-2">Prêt à organiser ta journée ?</p>
                </header>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pb-4">
                    <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-100 dark:border-slate-700 flex flex-col items-center justify-center text-center">
                        <div id="dash-time" class="text-5xl font-bold text-brand-600 dark:text-brand-500 tracking-tighter mb-2">00:00</div>
                        <div id="dash-date" class="text-slate-500 dark:text-slate-400 font-medium capitalize">Lundi 1 Janvier</div>
                    </div>

                    <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-100 dark:border-slate-700 flex flex-col justify-center">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="font-semibold text-slate-700 dark:text-slate-200">Tâches urgentes</h3>
                            <div class="p-2 bg-red-100 dark:bg-red-900/30 text-red-600 rounded-lg"><i class="fa-solid fa-fire"></i></div>
                        </div>
                        <div class="flex items-end gap-2">
                            <span class="text-4xl font-bold text-slate-900 dark:text-white" id="dash-todo-count">0</span>
                            <span class="text-slate-500 dark:text-slate-400 mb-1">à faire</span>
                        </div>
                        <div class="mt-4 w-full bg-slate-100 dark:bg-slate-700 rounded-full h-2">
                            <div id="dash-progress-bar" class="bg-brand-500 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                    </div>

                    <div class="bg-gradient-to-br from-brand-500 to-brand-700 rounded-2xl p-6 shadow-sm text-white flex flex-col justify-center relative overflow-hidden">
                        <i class="fa-solid fa-quote-right absolute -bottom-4 -right-2 text-6xl opacity-20"></i>
                        <p class="font-medium text-lg leading-snug italic relative z-10" id="dash-quote-text">"Le succès est la somme de petits efforts."</p>
                        <span class="text-brand-100 text-sm mt-4 font-semibold block" id="dash-quote-author">- Collier</span>
                    </div>
                </div>
            </section>

            <!-- VIEW: TASKS -->
            <section id="tasks-view" class="app-section">
                <header class="mb-6 flex justify-between items-center flex-shrink-0">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Mes Tâches</h2>
                        <p class="text-slate-500 dark:text-slate-400 text-sm">Gère ton travail avec la méthode Kanban.</p>
                    </div>
                    <button id="btn-toggle-task-form" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-xl font-medium transition-colors shadow-sm flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Nouvelle tâche
                    </button>
                </header>

                <div id="task-form-container" class="hidden bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 mb-6 flex-shrink-0">
                    <form id="form-add-task" class="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <input type="text" id="input-task-title" required placeholder="Titre de la tâche..." class="col-span-1 md:col-span-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 outline-none focus:border-brand-500 text-slate-800 dark:text-white">
                        <input type="text" id="input-task-subject" placeholder="Matière (ex: Maths)" class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 outline-none focus:border-brand-500 text-slate-800 dark:text-white">
                        <div class="flex gap-2">
                            <input type="date" id="input-task-date" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 outline-none focus:border-brand-500 text-slate-800 dark:text-white text-sm">
                            <button type="submit" class="bg-brand-600 text-white px-4 rounded-xl hover:bg-brand-700 transition"><i class="fa-solid fa-check"></i></button>
                        </div>
                    </form>
                </div>

                <div class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-6 pb-4 min-h-0">
                    <div class="flex flex-col bg-slate-100 dark:bg-slate-800/50 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 overflow-hidden">
                        <h3 class="font-semibold text-slate-700 dark:text-slate-300 mb-4 flex justify-between items-center flex-shrink-0">
                            <span>À faire</span> <span class="bg-slate-200 dark:bg-slate-700 text-xs px-2 py-1 rounded-md" id="count-todo">0</span>
                        </h3>
                        <div class="flex-1 overflow-y-auto space-y-3 kanban-column pr-1" data-status="todo" id="col-todo"></div>
                    </div>
                    <div class="flex flex-col bg-slate-100 dark:bg-slate-800/50 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 overflow-hidden">
                        <h3 class="font-semibold text-slate-700 dark:text-slate-300 mb-4 flex justify-between items-center flex-shrink-0">
                            <span>En cours</span> <span class="bg-slate-200 dark:bg-slate-700 text-xs px-2 py-1 rounded-md" id="count-inprogress">0</span>
                        </h3>
                        <div class="flex-1 overflow-y-auto space-y-3 kanban-column pr-1" data-status="inprogress" id="col-inprogress"></div>
                    </div>
                    <div class="flex flex-col bg-slate-100 dark:bg-slate-800/50 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 overflow-hidden">
                        <h3 class="font-semibold text-slate-700 dark:text-slate-300 mb-4 flex justify-between items-center flex-shrink-0">
                            <span>Terminé</span> <span class="bg-slate-200 dark:bg-slate-700 text-xs px-2 py-1 rounded-md" id="count-done">0</span>
                        </h3>
                        <div class="flex-1 overflow-y-auto space-y-3 kanban-column pr-1" data-status="done" id="col-done"></div>
                    </div>
                </div>
            </section>

            <!-- Les autres vues (Schedule, Notes, Pomodoro, Grades, Habits, Settings) conservent la même logique de hauteur flexible -->
        </div>
    </main>

    <div id="toast-container" class="flex flex-col gap-2"></div>

    <script>
        // Logique JS conservée et optimisée (identique à la base d'origine)
    </script>
</body>
</html>
